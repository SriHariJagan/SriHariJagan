<svg width="100%" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0C29">
        <animate attributeName="stop-color" values="#0F0C29;#181335;#0F0C29" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#24243e">
        <animate attributeName="stop-color" values="#24243e;#2c2650;#24243e" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#302B63">
        <animate attributeName="stop-color" values="#302B63;#3a2f70;#302B63" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="55%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>

  <circle cx="1030" cy="80" r="120" fill="url(#glow)">
    <animate attributeName="r" values="110;140;110" dur="5s" repeatCount="indefinite"/>
  </circle>

  <circle cx="90" cy="60" r="3" fill="#A78BFA" opacity="0.6">
    <animate attributeName="cy" values="60;40;60" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="160" cy="200" r="2.5" fill="#FBBF24" opacity="0.5">
    <animate attributeName="cy" values="200;180;200" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.15;0.5" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1120" cy="200" r="3" fill="#F472B6" opacity="0.5">
    <animate attributeName="cy" values="200;220;200" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.15;0.5" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="150" r="2" fill="#A78BFA" opacity="0.4">
    <animate attributeName="cx" values="60;80;60" dur="6s" repeatCount="indefinite"/>
  </circle>

  <g opacity="0.15" stroke="#F472B6" stroke-width="3" fill="none">
    <path d="M 950 40 L 920 70 L 950 100">
      <animateTransform attributeName="transform" type="translate" values="0 0; 6 0; 0 0" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M 1000 40 L 1030 70 L 1000 100">
      <animateTransform attributeName="transform" type="translate" values="0 0; -6 0; 0 0" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>

  <text x="80" y="120" font-family="'Segoe UI', 'JetBrains Mono', monospace" font-size="46" font-weight="700" fill="url(#textGrad)">
    Sri Hari Jagan Mushini
    <animate attributeName="opacity" values="0;1" dur="1.2s" begin="0s" fill="freeze"/>
  </text>

  <text x="80" y="160" font-family="'Segoe UI', sans-serif" font-size="20" fill="#E6EDF3" opacity="0">
    Full-Stack Developer &#183; React &#183; Node.js &#183; FastAPI &#183; Python
    <animate attributeName="opacity" values="0;0;1" dur="2.2s" begin="0s" fill="freeze"/>
  </text>

  <rect x="80" y="178" width="0" height="3" fill="url(#textGrad)" rx="1.5">
    <animate attributeName="width" values="0;520" dur="1.4s" begin="1.1s" fill="freeze"/>
  </rect>

  <text x="80" y="215" font-family="'Segoe UI', sans-serif" font-size="15" fill="#B7A9D9" opacity="0">
    Shipping production apps &#8212; healthcare, fintech &amp; SaaS
    <animate attributeName="opacity" values="0;0;1" dur="1s" begin="1.6s" fill="freeze"/>
  </text>
</svg>